name: Image
# Baut das Image für amd64 + arm64 und legt es auf ghcr.io/<owner>/command-center ab.
# Tag „vX.Y.Z“ → :X.Y.Z und :latest; main → :main
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/command-center
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=Command Center
            org.opencontainers.image.description=Linux-Server im Browser verwalten
            org.opencontainers.image.licenses=Elastic-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
