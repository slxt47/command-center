# Angriffs-Radar → fail2ban (seit 19.11.2026). angriffe-sammeln.py schreibt alle 2 min frische Web-Versuche nach
# /var/log/angriffe/web.log:  2026-11-19 08:10:01 ANGRIFF ip=1.2.3.4 art=geheim|scan|exploit ziel=… status=404
# web-scan: Suche nach Geheimnissen / Lücken-Scans (nur bei Fehler-Antwort) · web-exploit: ../, jndi, /proc/self …
[Definition]
_art = geheim|scan
failregex = ^ ANGRIFF ip=<HOST> art=(?:%(_art)s) ziel=\S+ status=\S+(?: zeit=\S+)?$
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
